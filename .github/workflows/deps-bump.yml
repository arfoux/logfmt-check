name: Dependency bump

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    name: bump dev dependency
    runs-on: ubuntu-latest
    env:
      # BRANCH unik per run: tidak perlu force-push, tidak menumpuk cabang liar
      BRANCH: automation/bump-dev-dep-${{ github.run_number }}
      # NAMA bebas (boleh "github-actions[bot]").
      # EMAIL wajib email yang terpasang di akun pemilik baris contributors.
      AUTHOR_NAME: github-actions[bot]
      AUTHOR_EMAIL: 129370680+arfoux@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: bump, commit, push
        run: |
          node scripts/bump-dev-dep.mjs
          git config user.name "$AUTHOR_NAME"
          git config user.email "$AUTHOR_EMAIL"
          git checkout -b "$BRANCH"
          git add package.json
          git commit -m "chore(deps): bump dev dependency"
          git push -u origin "$BRANCH"
          git log -1 --pretty='author=%an <%ae> committer=%cn <%ce>'

      - name: open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create --base main --head "$BRANCH" \
            --title "chore(deps): bump dev dependency" \
            --body "Automated dev-dependency bump."

      - name: rebase merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          number=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number')
          for attempt in 1 2 3 4 5 6; do
            if gh pr merge "$number" --rebase --delete-branch; then break; fi
            sleep 6
          done
          gh pr view "$number" --json state,mergedBy,mergeCommit
